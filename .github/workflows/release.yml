name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-before-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check src tests main.py
          pytest -v

  build-windows:
    needs: test-before-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "ViderDownloader-Windows-x64" `
            --paths src `
            --collect-all customtkinter `
            src/vider_downloader/__main__.py
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViderDownloader-Windows-x64
          path: dist/ViderDownloader-Windows-x64.exe

  build-linux:
    needs: test-before-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tkinter system library
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build Linux binary
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name "ViderDownloader-Linux-x64" \
            --paths src \
            --collect-all customtkinter \
            src/vider_downloader/__main__.py
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViderDownloader-Linux-x64
          path: dist/ViderDownloader-Linux-x64

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum ViderDownloader-Windows-x64.exe ViderDownloader-Linux-x64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/ViderDownloader-Windows-x64.exe
            release-assets/ViderDownloader-Linux-x64
            release-assets/SHA256SUMS.txt
