[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vider-downloader"
version = "1.0.0"
description = "Lightweight desktop GUI and CLI batch video downloader for vider.info / vider.pl"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Michał Jura" }
]
keywords = ["vider", "video-downloader", "batch-download", "gui", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "rich>=13.0.0",
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/P3rgam0n/Vider-Downloader"
Repository = "https://github.com/P3rgam0n/Vider-Downloader"
Issues = "https://github.com/P3rgam0n/Vider-Downloader/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
vider-dl = "vider_downloader.cli:main"

[project.gui-scripts]
vider-downloader = "vider_downloader.gui.app:launch_gui"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
